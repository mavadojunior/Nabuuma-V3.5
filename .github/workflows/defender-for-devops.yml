# Microsoft Security DevOps static analysis. All external actions are pinned
# to immutable commits and explicitly allowlisted in repository settings.
name: "Microsoft Defender For Devops"

on:
  push:
    branches: [ "main", "supa" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 20 * * 6'

permissions:
  contents: read

jobs:
  MSDO:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0
        id: msdo

      - name: Preserve SARIF scan report as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: microsoft-security-devops-sarif
          path: ${{ steps.msdo.outputs.sarifFile }}
          if-no-files-found: error
          retention-days: 14
