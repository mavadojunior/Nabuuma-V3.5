# Microsoft Security DevOps static analysis. All external actions are pinned
# to immutable commits and explicitly allowlisted in repository settings.
name: "Microsoft Defender For Devops"

on:
  push:
    branches: [ "main", "supa" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 20 * * 6'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  MSDO:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0
        id: msdo

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
