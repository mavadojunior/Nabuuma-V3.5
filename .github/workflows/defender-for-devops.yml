# Microsoft Security DevOps static analysis. All external actions are pinned
# to immutable commits and explicitly allowlisted in repository settings.
name: "Microsoft Defender For Devops"

on:
  push:
    branches: [ "main", "supa" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 20 * * 6'

permissions:
  contents: read
  security-events: write

jobs:
  MSDO:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0
        id: msdo

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
