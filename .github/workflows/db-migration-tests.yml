name: Database Migration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/check-migration-history.sh'
      - 'docs/PRODUCTION_MIGRATION_RECOVERY_MANIFEST_2026-11-14.csv'
      - '.github/workflows/db-migration-tests.yml'
      - 'scripts/engineering-preflight.sh'
      - 'AGENTS.md'
      - 'docs/ENGINEERING_WORKFLOW.md'
      - '.github/pull_request_template.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/check-migration-history.sh'
      - 'docs/PRODUCTION_MIGRATION_RECOVERY_MANIFEST_2026-11-14.csv'
      - '.github/workflows/db-migration-tests.yml'
      - 'scripts/engineering-preflight.sh'
      - 'AGENTS.md'
      - 'docs/ENGINEERING_WORKFLOW.md'
      - '.github/pull_request_template.md'

permissions:
  contents: read

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-engineering-preflight:
    name: Repository integrity and engineering preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify repository preflight
        run: bash scripts/engineering-preflight.sh

  audit-logs-security:
    name: PostgreSQL 17.6 — audit_logs least-privilege regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nabuuma_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nabuuma_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify recovered migration history
        run: bash scripts/check-migration-history.sh

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          timeout 30s bash -c \
            'until pg_isready -h 127.0.0.1 -p 5432 -U postgres -d nabuuma_rls_test; do sleep 1; done'

      - name: Prepare production-shaped audit_logs fixture
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: nabuuma_rls_test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/v3_15_7_audit_logs_setup.sql

      - name: Replay applied V3.15.6 reconciliation
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: nabuuma_rls_test
        run: |
          set -euo pipefail
          timeout 60s psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260921041538_nabuuma_v3156_service_table_explicit_rls_boundaries_reconcile.sql

      - name: Apply pending V3.15.7 audit-log hardening
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: nabuuma_rls_test
        run: |
          set -euo pipefail
          timeout 60s psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261019000000_v3_15_7_least_privilege_rls.sql

      - name: Verify ACLs, policies, and tenant behavior
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: nabuuma_rls_test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/v3_15_7_audit_logs_assertions.sql

      - name: Check patch whitespace
        run: git diff --check

  relation-acl-reconciliation:
    name: PostgreSQL 17.6 — relation and public-view ACL reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nabuuma_acl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nabuuma_acl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          timeout 30s bash -c \
            'until pg_isready -h 127.0.0.1 -p 5432 -U postgres -d nabuuma_acl_test; do sleep 1; done'

      - name: Prepare production-shaped relation ACL fixture
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: nabuuma_acl_test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/acl_reconciliation_setup.sql

      - name: Apply relation ACL reconciliation
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: nabuuma_acl_test
        run: |
          set -euo pipefail
          timeout 60s psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114043100_restore_client_acl_boundaries.sql

      - name: Verify relation ACL boundaries and all public-view grants
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: nabuuma_acl_test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/acl_reconciliation_assertions.sql

      - name: Verify migration idempotency
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: nabuuma_acl_test
        run: |
          set -euo pipefail
          timeout 60s psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114043100_restore_client_acl_boundaries.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/acl_reconciliation_assertions.sql

      - name: Check patch whitespace
        run: git diff --check


  full-schema-replay:
    name: Supabase local stack — complete migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify recovered migration history
        run: bash scripts/check-migration-history.sh

      - name: Install Supabase CLI
        run: npm install --global supabase@2.122.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start Supabase services
        run: supabase start --exclude studio,edge-runtime,logflare,vector

      - name: Replay every recovered and pending migration
        run: timeout 15m supabase --yes db reset --local --no-seed

      - name: Verify structural reconciliation and hardened trigger functions
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/schema_reconciliation_assertions.sql

      - name: Verify production-only ACL drift is absent
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/acl_reconciliation_assertions.sql

      - name: Verify view ACL migration idempotency on the full schema
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -X -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261114043100_restore_client_acl_boundaries.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/acl_reconciliation_assertions.sql

      - name: Stop Supabase services
        if: always()
        run: supabase stop --no-backup
