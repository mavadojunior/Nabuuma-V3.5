name: Deployment Readiness

# This repository does not yet contain a deployable application or a configured
# hosting provider. Keep this workflow manual and build-only until both exist.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-readiness:
    name: Application build readiness (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Require application source and verification scripts
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const scripts = pkg.scripts ?? {}
          const missing = ['build', 'typecheck', 'lint', 'test']
            .filter((name) => typeof scripts[name] !== 'string')
          const hasLockfile = fs.existsSync('package-lock.json')
          const hasApplicationSource = ['app', 'pages', 'src']
            .some((path) => fs.existsSync(path) && fs.statSync(path).isDirectory())

          if (!hasApplicationSource) {
            console.error('BLOCKED: no app/, pages/, or src/ application directory exists.')
          }
          if (missing.length > 0) {
            console.error('BLOCKED: missing package scripts: ' + missing.join(', '))
          }
          if (!hasLockfile) {
            console.error('BLOCKED: package-lock.json is required for reproducible npm ci installs.')
          }
          if (!hasApplicationSource || !hasLockfile || missing.length > 0) {
            process.exit(1)
          }
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Report boundary
        run: |
          echo "Build readiness checks passed." >> "$GITHUB_STEP_SUMMARY"
          echo "No deployment was performed. A hosting provider and deployment adapter must be configured separately." >> "$GITHUB_STEP_SUMMARY"
